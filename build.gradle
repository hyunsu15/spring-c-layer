// 선택 사항: Gradle이나 IntelliJ로 열 때 사용. run.ps1은 이 파일 없이도 동작한다.
plugins {
    id 'java'
}

// 설치된 JDK(17 이상)로 Java 17 대상 컴파일 — run.ps1의 javac --release 17과 같은 방식.
// (툴체인 고정은 JDK 17이 설치돼 있어야 해서 쓰지 않는다)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:6.2.6'
    implementation 'org.springframework:spring-jdbc:6.2.6'
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:3.0.4'
    implementation 'org.slf4j:slf4j-api:2.0.16'

    // 데모(사용 예시) 겸 시나리오 테스트 — src/test
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.3.232'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
